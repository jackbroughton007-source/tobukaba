<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spring Home Pond layer preview</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #24352d; }
  .scene { position: relative; width: min(100vw, calc(100vh * 1672 / 941)); aspect-ratio: 1672 / 941; overflow: hidden; }
  .scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; pointer-events: none; }
</style>
<div class="scene" aria-label="Spring Home Pond environment layer preview">
  <img src="sky-v1.png" alt="">
  <img src="distant-island-v1.png" alt="">
  <img src="far-bank-v1.png" alt="">
  <img src="pond-water-v1.png" alt="">
  <img src="main-bank-v1.png" alt="">
  <img src="tree-and-dock-v1.png" alt="">
  <img src="habitat-details-v1.png" alt="">
  <img src="foreground-plants-v1.png" alt="">
  <img src="light-effects-v1.png" alt="">
</div>
</html>
